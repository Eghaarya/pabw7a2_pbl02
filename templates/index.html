<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        table.data {
            border-collapse: collapse;
            width: 100%;
        }

        table.data th,
        table.data td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        table.data th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center">Open File CSV</h1>
        <form action="/" method="post" enctype="multipart/form-data" class="mt-4">
            <div class="form-row align-items-center">
                <div class="col-auto">
                    <input type="file" name="file" accept=".csv" required class="form-control-file">
                </div>
                <div class="col-auto">
                    <button type="submit" name="upload" class="btn btn-primary">Upload</button>
                </div>
            </div>
        </form>

        <h2 class="mt-5">Data dari CSV</h2>
        <hr>
        {% if table_html %}
        <div class="table-responsive">
            <div>{{ table_html|safe }}</div>
        </div>
        <form action="/" method="post" class="mt-3">
            <button type="submit" name="clear" class="btn btn-danger">Clear Table</button>
        </form>
        {% endif %}
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.11/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
